<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuestos Taller</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1f4fd8">
<script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar no-print">
  <strong id="brand">Taller</strong>
  <div class="hdr-right">
  <div id="nav" hidden>
    <div class="tabs">
      <button data-go="list">📄 Presupuestos</button>
      <button data-go="clients">👤 Clientes</button>
      <button data-go="new">＋ Nuevo</button>
      <button data-go="profile">⚙️ Perfil</button>
    </div>
    <button id="logout" title="Cerrar sesión">Salir</button>
  </div>
  <button id="theme" title="Tema: sistema / claro / oscuro"></button>
  </div>
</header>
<main id="app"></main>
<div id="toast" class="no-print"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
