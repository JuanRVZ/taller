# Supabase (plan gratis) pausa el proyecto tras una semana sin actividad.
# Esta tarea hace una consulta ligera cada 3 días para que no se pause nunca.
# Si la consulta falla, la tarea falla y GitHub avisa por email al propietario del repo.
name: Mantener Supabase despierto

on:
  schedule:
    - cron: "17 7 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta ligera a la base de datos
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js | head -1)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/presupuestos?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta de Supabase: $code"
          [ "$code" = "200" ]
